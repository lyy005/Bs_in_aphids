[x-axis]
where = top

[hic matrix]
#file = hic_corrected.h5
file = hic_corrected_30kb.h5
#file = hic_matrix.h5
#file = hic_matrix_30kb.h5
title = Hi-C data
# depth is the maximum distance plotted in bp. In Hi-C tracks
# the height of the track is calculated based on the depth such
# that the matrix does not look deformed
#depth = 100000
depth = 300000
transform = log1p
file_type = hic_matrix
height = 4

[tads]
#file = hic_corrected.findTADs_domains.bed
file = hic_corrected_30kb.findTADs_domains.bed
#file = hic_matrix.findTADs_domains.bed
file_type = domains
border_color = black
color = none
line_width = 1
# the tads are overlay over the hic-matrix
# the share-y options sets the y-axis to be shared
# between the Hi-C matrix and the TADs.
overlay_previous = share-y

[spacer]

[bedgraph file test]
file = hic_corrected_30kb.findTADs_score.bedgraph
#file = hic_matrix.findTADs_score.bedgraph
# height of the track in cm (optional value)
height = 4
title = TAD
min_value = -2.5
max_value = 2.5
